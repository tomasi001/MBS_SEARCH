services:
  - type: web
    name: mbs-vector-server
    env: python
    plan: free
    buildCommand: poetry install --only=main
    startCommand: poetry run python production/vector_server.py
    healthCheckPath: /health
    envVars:
      - key: USE_LOCAL_EMBEDDINGS
        value: "true"
      - key: LOCAL_EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./chroma_db"
      - key: DEBUG
        value: "false"
