services:
  - type: web
    name: mbs-search
    env: python
    plan: free
    rootDir: production/
    buildCommand: cp pyproject_vector_gemini.toml pyproject.toml && poetry install --only=main --no-root
    startCommand: poetry run python vector_server_gemini.py
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./chroma_db"
      - key: DEBUG
        value: "false"
