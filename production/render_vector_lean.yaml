services:
  - type: web
    name: mbs-vector-server
    env: python
    plan: free
    rootDir: production/
    buildCommand: cp pyproject_vector_gemini.toml pyproject.toml && poetry install --only=main --no-root
    startCommand: poetry run python vector_server_gemini.py
    healthCheckPath: /health
    buildFilters:
      includedPaths:
        - vector_server_gemini.py
        - pyproject_vector_gemini.toml
        - config.py
        - ../mbs.db
      ignoredPaths:
        - "*"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_GEMINI_EMBEDDINGS
        value: "true"
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./chroma_db"
      - key: DEBUG
        value: "false"
