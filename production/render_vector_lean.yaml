services:
  - type: web
    name: mbs-vector-server
    env: python
    plan: free
    rootDir: production/
    buildCommand: cp pyproject_vector.toml pyproject.toml && poetry install --only=main --no-root
    startCommand: poetry run python vector_server.py
    healthCheckPath: /health
    buildFilters:
      includedPaths:
        - vector_server.py
        - pyproject_vector.toml
        - ../config.py
      ignoredPaths:
        - "*"
    envVars:
      - key: USE_LOCAL_EMBEDDINGS
        value: "true"
      - key: LOCAL_EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./chroma_db"
      - key: DEBUG
        value: "false"


