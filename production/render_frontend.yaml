services:
  - type: web
    name: mbs-frontend-server
    env: python
    plan: free
    buildCommand: poetry install --only=main --no-root
    startCommand: poetry run python production/frontend_server.py
    healthCheckPath: /health
    envVars:
      - key: AI_SERVER_URL
        value: "https://mbs-ai-server.onrender.com"
      - key: VECTOR_SERVER_URL
        value: "https://mbs-vector-server.onrender.com"
      - key: MBS_DB_PATH
        value: "mbs.db"
      - key: DEBUG
        value: "false"


